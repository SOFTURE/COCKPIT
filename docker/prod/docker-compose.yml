# Production stack of cockpit on one VPS, generated by `softure-deploy init` (@softure-ai/deploy 0.7.10).
# The app owns this file now; init never overwrites it without --force.
#
# docker/server/deploy.sh runs it on the server as `docker compose --env-file .env.prod up -d --wait`, with TAG set
# to the release tag. Every variable below in the required form (a dollar, a brace, the name, then :?) is a
# secret: the deploy workflow renders exactly these names into .env.prod with `softure-deploy env render`, so this
# file stays the one list of what production needs. A comment must not spell that form out: it would count too.
# Passwords go into connection URLs as they are: use URL-safe values, e.g. `openssl rand -hex 32`.
#
# This stack runs no Traefik: the app joins the external edge network of the Traefik another stack on this server runs
# (init --edge), and its labels publish it there. The optional variable EDGE_NETWORK names that network (default
# softure-edge), a `production` environment variable rendered into .env.prod from the workflow's app-vars. That Traefik needs the Docker provider
# (exposedByDefault=false), the entry point websecure and the certificate resolver letsencrypt.
#
# Other containers on that network reach the app without the router, so a client-IP header proves nothing there.
# The router's first middleware sets X-Softure-Edge-Proof to the secret EDGE_PROOF_SECRET, which the app also gets:
# wrap the app's resolver in edgeProofIp from @softure-ai/security, so it trusts the header only on proven requests.
#
# The host name is runtime configuration, never committed: APP_HOST is the repository variable `softure-host app add`
# sets, rendered into .env.prod from the workflow's app-vars. Postgres publishes no port (another app on the shared
# host may hold 5432); deploy.json sets database.access to compose-exec, so backups run inside the postgres service.
name: cockpit

# The off-site copy of the nightly backup (@softure-ai/backup): deploy.sh's maintain reads these names from .env.prod
# on the host; no container gets them. All are optional: without BACKUP_S3_BUCKET the step is skipped. The access key
# is a write-only token, BACKUP_AGE_RECIPIENT an age public key; the private key never comes to this server.
x-offsite-backup:
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}

# Telemetry to an OTLP backend (Grafana Cloud's OTLP gateway): logs, traces and metrics of the app, the worker and
# migrate (@softure-ai/observability). OTEL_EXPORTER_OTLP_ENDPOINT is a variable, OTEL_EXPORTER_OTLP_HEADERS a secret
# holding the Authorization header (`Authorization=Basic%20<base64 of instance-id:token>`). Both optional: without the
# endpoint nothing is exported and every process logs to its console only. APP_ENVIRONMENT names the environment.
services:
  app:
    image: ghcr.io/softure/cockpit:${TAG}
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      APP_ORIGIN: https://${APP_HOST:?}
      # The release tag for the build info route (@softure-ai/ops): the deploy's smoke check compares it with the tag.
      SOFTURE_RELEASE: ${TAG}
      DATABASE_URL: postgresql://softure_app:${SOFTURE_APP_PASSWORD:?}@postgres:5432/cockpit
      # The edge proof (@softure-ai/security edgeProofIp): the value the router sets on X-Softure-Edge-Proof.
      EDGE_PROOF_SECRET: ${EDGE_PROOF_SECRET:?}
      # Which header names the client behind the edge: cloudflare (default), forwarded-for or header:<name>.
      CLIENT_IP_SOURCE: ${CLIENT_IP_SOURCE:-cloudflare}
      FORGE_TOKEN: ${FORGE_TOKEN:?}
      # More fine-grained tokens, one per further resource owner (an organisation), comma-separated. Optional.
      FORGE_EXTRA_TOKENS: ${FORGE_EXTRA_TOKENS:-}
      FORGE_API_URL: ${FORGE_API_URL:-https://api.github.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      # The language of the screens, the mails and MCP: en (default) or pl.
      APP_LOCALE: ${APP_LOCALE:-en}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-30}
      # The digest mail (FR-12), the same names as the worker's: the app verifies the one-click unsubscribe links and
      # loads the same configuration. All optional: without DIGEST_RECIPIENTS, MAIL_FROM or SOFTURE_EMAIL_KEY_SECRET the
      # digest stays off.
      # The app also mails invitations (FR-16) with MAIL_FROM and RESEND_API_KEY; without them they stay "not sent".
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILING_UNSUBSCRIBE_SECRET: ${MAILING_UNSUBSCRIBE_SECRET:-}
      MAILING_UNSUBSCRIBE_SECRET_PREVIOUS: ${MAILING_UNSUBSCRIBE_SECRET_PREVIOUS:-}
      SOFTURE_EMAIL_KEY_SECRET: ${SOFTURE_EMAIL_KEY_SECRET:-}
      DIGEST_RECIPIENTS: ${DIGEST_RECIPIENTS:-}
      DIGEST_AT: ${DIGEST_AT:-08:00}
      # Waking projects (CT-10): seals the routine tokens stored in the database (at least 32 characters, never
      # changed). Optional: without it no routine can be stored or fired. The app stores and tests routines and fires
      # after an answer or a broadcast; the worker drains the queued fires.
      ROUTINE_TOKEN_SECRET: ${ROUTINE_TOKEN_SECRET:-}
      # Assistants over MCP (FR-13, FR-14): only the app serves /api/mcp. Both optional variables: MCP_ALLOW_WRITES=0
      # makes every token read only (empty keeps answering on for write tokens and grants), MCP_DIAGNOSTICS=1 logs one
      # line per request (no token, body or arguments) through the app's logger.
      MCP_ALLOW_WRITES: ${MCP_ALLOW_WRITES:-}
      MCP_DIAGNOSTICS: ${MCP_DIAGNOSTICS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The edge network for Traefik, the project's own for Postgres; names are prefixed with cockpit, so they never
    # clash with the other stack's routers.
    networks:
      - edge
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${EDGE_NETWORK:-softure-edge}"
      - "traefik.http.routers.cockpit.rule=Host(`${APP_HOST:?}`)"
      - "traefik.http.routers.cockpit.entrypoints=websecure"
      - "traefik.http.routers.cockpit.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cockpit.service=cockpit"
      - "traefik.http.routers.cockpit.middlewares=cockpit-edge-proof,cockpit-security-headers"
      - "traefik.http.services.cockpit.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.cockpit-edge-proof.headers.customrequestheaders.X-Softure-Edge-Proof=${EDGE_PROOF_SECRET:?}"
      - "traefik.http.middlewares.cockpit-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.cockpit-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.cockpit-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.cockpit-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  # The job worker (@softure-ai/jobs): the same image running `node worker.mjs`, with the app's environment. It
  # serves no HTTP, so the image's health check (which asks the app's port) is replaced by one of its loop:
  # `node worker.mjs --health` passes while the loop touched its health file within five poll intervals (at least
  # 30 s), so `docker compose up --wait` waits for a loop that reached the database. On a deploy it gets SIGTERM, lets
  # running jobs finish for the module's shutdownGraceMs (20 s by default) and releases the rest; the stop grace
  # period below leaves it that time before Docker kills it.
  worker:
    image: ghcr.io/softure/cockpit:${TAG}
    restart: unless-stopped
    command: ["node", "worker.mjs"]
    environment:
      APP_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      APP_ORIGIN: https://${APP_HOST:?}
      # The release tag: the worker's telemetry names the release it runs (service.version).
      SOFTURE_RELEASE: ${TAG}
      DATABASE_URL: postgresql://softure_app:${SOFTURE_APP_PASSWORD:?}@postgres:5432/cockpit
      FORGE_TOKEN: ${FORGE_TOKEN:?}
      # More fine-grained tokens, one per further resource owner (an organisation), comma-separated. Optional.
      FORGE_EXTRA_TOKENS: ${FORGE_EXTRA_TOKENS:-}
      FORGE_API_URL: ${FORGE_API_URL:-https://api.github.com}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      # The language of the screens, the mails and MCP: en (default) or pl.
      APP_LOCALE: ${APP_LOCALE:-en}
      # How often every watched project is read, in minutes: 15 to 60.
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-30}
      # The digest mail (FR-12): once a day at DIGEST_AT (HH:MM in APP_TIMEZONE) to every address in DIGEST_RECIPIENTS
      # (comma-separated), from MAIL_FROM through Resend. All optional: without recipients, a sender or
      # SOFTURE_EMAIL_KEY_SECRET (it keys each recipient) it stays off.
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILING_UNSUBSCRIBE_SECRET: ${MAILING_UNSUBSCRIBE_SECRET:-}
      MAILING_UNSUBSCRIBE_SECRET_PREVIOUS: ${MAILING_UNSUBSCRIBE_SECRET_PREVIOUS:-}
      SOFTURE_EMAIL_KEY_SECRET: ${SOFTURE_EMAIL_KEY_SECRET:-}
      DIGEST_RECIPIENTS: ${DIGEST_RECIPIENTS:-}
      DIGEST_AT: ${DIGEST_AT:-08:00}
      # Waking projects (CT-10): seals the routine tokens stored in the database (at least 32 characters, never
      # changed). Optional: without it no routine can be stored or fired. The app stores and tests routines and fires
      # after an answer or a broadcast; the worker drains the queued fires.
      ROUTINE_TOKEN_SECRET: ${ROUTINE_TOKEN_SECRET:-}
      # Health from observability (FR-16): the scan reads each project's own alert rules from Grafana at GRAFANA_URL
      # with GRAFANA_TOKEN (a service account token that may read alert rules). Only the worker scans, so the app gets
      # neither. Both optional: without either, no project shows health.
      GRAFANA_URL: ${GRAFANA_URL:-}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "worker.mjs", "--health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off: applies the migrations of the new image as the migrator role before the app starts. A failed
  # migration stops the deploy here; the old app container keeps serving.
  migrate:
    image: ghcr.io/softure/cockpit:${TAG}
    command: ["node", "migrate.mjs", "--migrations-dir", "./softure-migrations"]
    environment:
      APP_ENVIRONMENT: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      SOFTURE_RELEASE: ${TAG}
      DATABASE_URL: postgresql://softure_migrator:${SOFTURE_MIGRATOR_PASSWORD:?}@postgres:5432/cockpit
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # initdb/ creates the migrator and app roles on the first start (the @softure-ai/ops recipe). No port is published:
  # deploy.sh's backup, schema guard and row counts run inside this service (database.access compose-exec).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: cockpit
      SOFTURE_MIGRATOR_PASSWORD: ${SOFTURE_MIGRATOR_PASSWORD:?}
      SOFTURE_APP_PASSWORD: ${SOFTURE_APP_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during initdb the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cockpit"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:

networks:
  edge:
    name: ${EDGE_NETWORK:-softure-edge}
    external: true
