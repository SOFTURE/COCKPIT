# The gates, the e2e, the deploy dry run, the CLI publish dry run and the context doctor on every pull request and on every push to master:
# the same jobs with the same settings on both, and a pull request runs them on its merge with master.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      # The same suite again with twice the workers: the specs share one database and scan it in parallel, so a race
      # between them fails here on the pull request instead of now and then on master. No retries in either run.
      - name: e2e under load
        run: npm run e2e -- --workers=4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Everything a release does short of the owner's server: the production image, .env.prod rendered from fictional
  # values, and the production compose file up and healthy (scripts/deploy-dry-run.sh).
  deploy-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/deploy-dry-run.sh

  # The CLI package short of the registry: packed, `npm publish --dry-run`, installed from its tarball and run
  # (scripts/cli-publish-dry-run.sh). Publishing is the manual `publish-cli` workflow, on the owner's word.
  cli-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: scripts/cli-publish-dry-run.sh

  # Outside readers look for this check run by name on the main branch's head (@softure-ai/skills README).
  context-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes --package @softure-ai/skills@0.37.0 softure-skills doctor
        env:
          npm_config_ignore_scripts: "true"
